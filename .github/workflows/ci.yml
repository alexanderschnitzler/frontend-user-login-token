name: CI

on: [ push, pull_request ]

jobs:
  tests:
    name: "PHP ${{ matrix.php }} | ${{ matrix.composerInstall }}"
    runs-on: ubuntu-22.04
    strategy:
      # This prevents cancellation of matrix job runs, if one/two already failed and let the
      # rest matrix jobs be executed anyway.
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        composerInstall: [ 'composerInstallLowest', 'composerInstallHighest' ]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, sodium
          coverage: none

      - name: Composer install (lowest)
        if: matrix.composerInstall == 'composerInstallLowest'
        run: composer update --prefer-lowest --no-interaction --no-progress --prefer-dist

      - name: Composer install (highest)
        if: matrix.composerInstall == 'composerInstallHighest'
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: phplint
        run: composer phplint

      - name: phpstan
        run: composer phpstan

      - name: php-cs-fixer
        run: composer cs
